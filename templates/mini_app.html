<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location Finder</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: Arial, sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #172554); }
    main { max-width: 520px; margin: 0 auto; padding: 32px 20px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 25px; }
    p { line-height: 1.5; }
    .link { display: block; overflow-wrap: anywhere; margin: 22px 0; padding: 12px; border-radius: 10px; background: #eef2ff; color: #312e81; text-decoration: none; font-size: 13px; }
    .copy { border: 0; padding: 13px 18px; border-radius: 10px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); font: inherit; font-weight: 700; cursor: pointer; }
    #copy-status { min-height: 1.4em; margin: 12px 0 0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Location Finder</h1>
    <p>Use the link below to open the location finder. It expires in 15 minutes.</p>
    <a class="link" href="{{ website_link }}">{{ website_link }}</a>
    <button class="copy" id="copy-link" type="button">Copy Link</button>
    <p id="copy-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const websiteLink = {{ website_link | tojson }};
    const copyButton = document.getElementById("copy-link");
    const copyStatus = document.getElementById("copy-status");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(websiteLink);
        copyStatus.textContent = "Link copied to clipboard.";
      } catch {
        copyStatus.textContent = "Unable to copy automatically. Select the link above and copy it manually.";
      }
    });
  </script>
</body>
</html>
