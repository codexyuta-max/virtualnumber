<!DOCTYPE html>
<html>
<head>
  <title>Consent Demo</title>
  <style>
    body { font-family: Arial; padding: 30px; }
    .card { margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .btn { padding: 10px 15px; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>Consent Required</h2>
  <p>This demo collects basic browser info only after you allow.</p>
  <button id="allow-btn" class="btn">Allow</button>
</div>

<div class="card">
  <h2>Collected Info</h2>
  <pre id="result">No data collected yet.</pre>
</div>

<div class="card">
  <h2>Send to Telegram</h2>
  <input id="user-id" type="text" readonly />
  <br><br>
  <button id="send-btn" class="btn" disabled>Send</button>
  <p id="status"></p>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
